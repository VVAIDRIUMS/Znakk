<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Знакомства - Взгляд</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="logo-row" title="Кликните, чтобы вставить URL логотипа">
        <img id="logo-img" class="logo-img" src="" alt="Логотип" />
        <div class="logo">Взгляд</div>
      </div>
      
      <!-- City filter -->
      <select id="city-filter" class="city-filter" aria-label="Фильтр города">
        <option value="all">Все города</option>
        <option value="Москва">Москва</option>
        <option value="Санкт-Петербург">Санкт-Петербург</option>
        <option value="Екатеринбург">Екатеринбург</option>
        <option value="Казань">Казань</option>
        <option value="Новосибирск">Новосибирск</option>
        <option value="Владивосток">Владивосток</option>
        <option value="Ростов-на-Дону">Ростов-на-Дону</option>
        <option value="Красноярск">Красноярск</option>
        <option value="Воронеж">Воронеж</option>
        <option value="Самара">Самара</option>
        <option value="Омск">Омск</option>
        <option value="Уфа">Уфа</option>
        <option value="Челябинск">Челябинск</option>
        <option value="Пермь">Пермь</option>
      </select>
      
      <!-- Gender filter -->
      <select id="gender-filter" class="city-filter" aria-label="Фильтр по полу">
        <option value="all">Любой пол</option>
        <option value="male">Мужчина</option>
        <option value="female">Женщина</option>
      </select>
      
      <button id="theme-toggle" class="theme-toggle" aria-label="Переключить тему">🌓</button>
      <button id="saved-btn" class="saved-btn header-saved" aria-label="Понравившиеся">❤</button>
      <button id="who-liked-btn" class="saved-btn header-saved" aria-label="Кто лайкнул меня">👀</button>
      <button id="create-btn" class="create-btn" aria-label="Создать анкету">＋</button>
      
      <!-- ✅ НОВОЕ - Кнопка авторизации с эмейлом -->
      <button id="auth-btn" class="auth-btn" aria-label="Вход/Регистрация">
        <span class="auth-btn-icon">👤</span>
        <span class="auth-btn-text" id="auth-btn-text"></span>
      </button>
    </header>

    <div class="main-content">
      <div class="card-container">
        <div class="card-stack">
          <!-- Cards will be injected here -->
        </div>
      </div>
      
      <div class="action-buttons">
        <div class="action-main-buttons">
          <button class="skip-btn" id="skip-btn" aria-label="Пропустить">✕</button>
          <button class="like-btn" id="like-btn" aria-label="Лайк">❤</button>
        </div>
        <button class="refresh-btn" id="refresh-btn" aria-label="Обновить карточки">🔄</button>
      </div>
    </div>

    <!-- Liked people panel -->
    <section class="liked-panel" aria-hidden="true">
      <header class="liked-header">
        <button class="back-btn" aria-label="Назад">←</button>
        <span class="liked-title"><span class="liked-title-heart" aria-hidden="true">❤</span>Понравившиеся</span>
      </header>
      <div class="liked-list">
        <!-- Liked profiles will be rendered here -->
      </div>
    </section>

    <!-- "Who liked me" panel: shows profiles that liked you -->
    <section class="who-liked-panel" aria-hidden="true">
      <header class="liked-header">
        <button class="who-back-btn back-btn" aria-label="Назад">←</button>
        <span class="liked-title"><span class="liked-title-heart" aria-hidden="true">👀</span>Кто лайкнул меня</span>
      </header>
      <div class="who-liked-list">
        <!-- Profiles who liked the user will be rendered here -->
      </div>
    </section>

    <!-- Create profile panel -->
    <section class="create-panel" aria-hidden="true">
      <div class="create-card">
        <header class="create-header">
          <h3>Создать анкету</h3>
          <button class="create-close" aria-label="Закрыть">✕</button>
        </header>
        <div class="create-body">
          <input id="create-name" placeholder="Имя" />
          <input id="create-age" type="number" placeholder="Возраст" />
          <select id="create-gender" class="city-filter">
            <option value="">Выберите пол</option>
            <option value="male">Мужчина</option>
            <option value="female">Женщина</option>
          </select>
          <input id="create-city" placeholder="Город (например, Москва • онлайн)" />
          <input id="create-photo" placeholder="URL фото" />
          <input id="create-contact" placeholder="Контакт (например, @ваш_ник или телефон)" />
          <textarea id="create-bio" placeholder="Кратко о себе"></textarea>
          <input id="create-tags" placeholder="Теги через запятую" />
          <div class="create-actions">
            <button id="create-preview" class="reg-btn subtle">Просмотреть</button>
            <button id="create-save" class="reg-btn">Сохранить в стеке</button>
          </div>
          <div class="create-preview-area" aria-hidden="true"></div>
        </div>
      </div>
    </section>

    <!-- Profile view panel -->
    <section class="profile-view-panel" aria-hidden="true">
      <div class="profile-view-card">
        <header class="profile-view-header">
          <h3>Просмотр анкеты</h3>
          <button class="profile-view-close" aria-label="Закрыть">✕</button>
        </header>
        <div class="profile-view-content">
          <div class="profile-view-photo" id="profile-view-photo"></div>
          <div class="profile-view-info">
            <div>
              <div class="profile-view-name" id="profile-view-name"></div>
              <div class="profile-view-age" id="profile-view-age"></div>
            </div>
            <div class="profile-view-field">
              <span class="profile-view-label">Пол:</span>
              <span class="profile-view-value" id="profile-view-gender"></span>
            </div>
            <div class="profile-view-field">
              <span class="profile-view-label">Город:</span>
              <span class="profile-view-value" id="profile-view-city"></span>
            </div>
            <div class="profile-view-field">
              <span class="profile-view-label">О себе:</span>
              <span class="profile-view-value" id="profile-view-bio"></span>
            </div>
            <div class="profile-view-field">
              <span class="profile-view-label">Контакты:</span>
              <span class="profile-view-value" id="profile-view-contact"></span>
            </div>
            <div class="profile-view-field">
              <span class="profile-view-label">Теги:</span>
              <span class="profile-view-value" id="profile-view-tags"></span>
            </div>
          </div>
          <div class="profile-view-actions">
            <button id="profile-view-like-btn" class="reg-btn" style="background: #34c759;">Лайкнуть</button>
            <button id="profile-view-unlike-btn" class="reg-btn subtle" style="background: #ff3b30; color: white;">Убрать лайк</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Auth panel -->
    <section class="auth-panel" aria-hidden="true">
      <div class="auth-card">
        <header class="auth-header">
          <h3>Вход и регистрация</h3>
          <button class="auth-close" aria-label="Закрыть">✕</button>
        </header>
        <div class="auth-tabs">
          <div class="auth-tab active" id="login-tab">Вход</div>
          <div class="auth-tab" id="register-tab">Регистрация</div>
        </div>
        <div class="auth-body">
          <div id="auth-message" class="auth-message"></div>
          
          <!-- Login form -->
          <div id="login-form">
            <input id="login-email" type="email" placeholder="Email" />
            <input id="login-password" type="password" placeholder="Пароль" />
            <div class="auth-actions">
              <button id="login-btn" class="reg-btn">Войти</button>
            </div>
          </div>
          
          <!-- Register form -->
          <div id="register-form" style="display: none;">
            <input id="register-email" type="email" placeholder="Email" />
            <input id="register-password" type="password" placeholder="Пароль" />
            <input id="register-confirm-password" type="password" placeholder="Подтвердите пароль" />
            <div class="auth-actions">
              <button id="register-btn" class="reg-btn">Зарегистрироваться</button>
            </div>
          </div>
          
          <!-- Logout form -->
          <div id="logout-form" style="display: none;">
            <div class="user-info">
              <span>Вы вошли как:</span>
              <span class="user-email" id="current-user-email"></span>
            </div>
            <div class="auth-actions">
              <button id="logout-btn" class="reg-btn" style="background: #ff3b30;">Выйти</button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <script src="/static/main.js"></script>
</body>
</html>
